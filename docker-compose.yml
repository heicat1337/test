name: web3-nav

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: web3-postgres
    command: postgres -c timezone=${TZ:-Asia/Shanghai}
    environment:
      POSTGRES_DB: "${DB_NAME:-geo_system}"
      POSTGRES_USER: "${DB_USER:-geo_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-geo_password}"
      TZ: "${TZ:-Asia/Shanghai}"
      PGTZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_nav_data.sql:/docker-entrypoint-initdb.d/20-nav-data.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-geo_user} -d ${DB_NAME:-geo_system}"]
      interval: 10s
      timeout: 5s
      retries: 10

  geoflow:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: web
    image: web3-nav:geoflow
    container_name: web3-geoflow
    init: true
    ports:
      - "127.0.0.1:${GEOFLOW_PORT:-18080}:8080"
    environment:
      DB_DRIVER: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:-geo_system}"
      DB_USER: "${DB_USER:-geo_user}"
      DB_PASSWORD: "${DB_PASSWORD:-geo_password}"
      APP_PORT: "8080"
      SITE_URL: "${SITE_URL:-http://localhost}"
      APP_SECRET_KEY: "${APP_SECRET_KEY:-change-me-to-a-random-secret-key}"
      REQUIRE_STRONG_APP_SECRET: "${REQUIRE_STRONG_APP_SECRET:-false}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./backend:/var/www/html
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Phase 1：新 Laravel 后端（与老 geoflow 并排跑）
  # 镜像由 scripts/Dockerfile.composer-intl 本地构建：
  #   docker build -t composer-intl:local -f scripts/Dockerfile.composer-intl scripts/
  laravel:
    image: composer-intl:local
    container_name: web3-laravel
    working_dir: /app
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    environment:
      APP_ENV: local
      AUTO_SEED: "${AUTO_SEED:-true}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: "${DB_NAME:-geo_system}"
      DB_USERNAME: "${DB_USER:-geo_user}"
      DB_PASSWORD: "${DB_PASSWORD:-geo_password}"
    volumes:
      - ./backend-laravel:/app
    ports:
      - "127.0.0.1:${LARAVEL_PORT:-18081}:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: web3-nav:nginx
    container_name: web3-nginx
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      - geoflow
      - laravel

  # Phase 9.4：Laravel scheduler — 替代老 backend scheduler
  laravel-scheduler:
    image: composer-intl:local
    container_name: web3-laravel-scheduler
    profiles: ["scheduler"]
    working_dir: /app
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          php /app/artisan schedule:run --verbose --no-interaction
          sleep 60
        done
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: "${DB_NAME:-geo_system}"
      DB_USERNAME: "${DB_USER:-geo_user}"
      DB_PASSWORD: "${DB_PASSWORD:-geo_password}"
    volumes:
      - ./backend-laravel:/app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Phase 9.4：Laravel worker — 替代老 backend worker
  laravel-worker:
    image: composer-intl:local
    container_name: web3-laravel-worker
    profiles: ["scheduler"]
    working_dir: /app
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["php", "artisan", "geoflow:worker"]
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: "${DB_NAME:-geo_system}"
      DB_USERNAME: "${DB_USER:-geo_user}"
      DB_PASSWORD: "${DB_PASSWORD:-geo_password}"
    volumes:
      - ./backend-laravel:/app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
