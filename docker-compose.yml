name: web3-nav

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: web3-postgres
    command: postgres -c timezone=${TZ:-Asia/Shanghai}
    environment:
      POSTGRES_DB: "${DB_NAME:-geo_system}"
      POSTGRES_USER: "${DB_USER:-geo_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-geo_password}"
      TZ: "${TZ:-Asia/Shanghai}"
      PGTZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_nav_data.sql:/docker-entrypoint-initdb.d/20-nav-data.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-geo_user} -d ${DB_NAME:-geo_system}"]
      interval: 10s
      timeout: 5s
      retries: 10

  geoflow:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: web
    image: web3-nav:geoflow
    container_name: web3-geoflow
    init: true
    ports:
      - "127.0.0.1:${GEOFLOW_PORT:-18080}:8080"
    environment:
      DB_DRIVER: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:-geo_system}"
      DB_USER: "${DB_USER:-geo_user}"
      DB_PASSWORD: "${DB_PASSWORD:-geo_password}"
      APP_PORT: "8080"
      SITE_URL: "${SITE_URL:-http://localhost}"
      APP_SECRET_KEY: "${APP_SECRET_KEY:-change-me-to-a-random-secret-key}"
      REQUIRE_STRONG_APP_SECRET: "${REQUIRE_STRONG_APP_SECRET:-false}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./backend:/var/www/html
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: web3-nav:nginx
    container_name: web3-nginx
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      - geoflow

  scheduler:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: scheduler
    image: web3-nav:scheduler
    container_name: web3-scheduler
    profiles: ["scheduler"]
    init: true
    environment:
      DB_DRIVER: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:-geo_system}"
      DB_USER: "${DB_USER:-geo_user}"
      DB_PASSWORD: "${DB_PASSWORD:-geo_password}"
      CRON_INTERVAL: "${CRON_INTERVAL:-60}"
      APP_SECRET_KEY: "${APP_SECRET_KEY:-change-me-to-a-random-secret-key}"
      REQUIRE_STRONG_APP_SECRET: "${REQUIRE_STRONG_APP_SECRET:-false}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./backend:/var/www/html
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: scheduler
    image: web3-nav:worker
    container_name: web3-worker
    profiles: ["scheduler"]
    init: true
    command: ["php", "/var/www/html/bin/worker.php"]
    environment:
      DB_DRIVER: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:-geo_system}"
      DB_USER: "${DB_USER:-geo_user}"
      DB_PASSWORD: "${DB_PASSWORD:-geo_password}"
      APP_SECRET_KEY: "${APP_SECRET_KEY:-change-me-to-a-random-secret-key}"
      REQUIRE_STRONG_APP_SECRET: "${REQUIRE_STRONG_APP_SECRET:-false}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./backend:/var/www/html
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
