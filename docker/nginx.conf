server {
    listen 80;
    server_name _;
    client_max_body_size 20M;
    root /usr/share/nginx/html;

    # Frontend static assets (JS/CSS/SVG etc.) - serve directly
    location /assets/ {
        try_files $uri =404;
    }

    # Admin panel
    location /heicat {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GEOFlow API
    location /api {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GEOFlow backend assets
    location ~ ^/(themes|lang|includes)/ {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
    }

    # GEOFlow root PHP files (article.php, category.php, etc.)
    location ~ \.php$ {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue SPA fallback - must be last
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
