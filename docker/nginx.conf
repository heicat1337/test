server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # Vue SPA static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # GEOFlow admin panel
    location /admin {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GEOFlow API
    location /api {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GEOFlow PHP assets and other backend routes
    location ~ ^/(assets|themes|lang|includes)/ {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
    }

    # GEOFlow root PHP files (article.php, category.php, etc.)
    location ~ \.php$ {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
