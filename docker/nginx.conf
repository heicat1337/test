# Gzip 全局开启
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/rss+xml
    application/atom+xml
    application/manifest+json
    application/ld+json
    application/wasm
    image/svg+xml
    font/ttf
    font/otf;

# 爬虫 UA 识别 — Baidu / Google / Bing / 360 / Sogou / Yandex / SNS 抓取器
map $http_user_agent $is_crawler {
    default 0;
    ~*Baiduspider           1;
    ~*Googlebot             1;
    ~*bingbot               1;
    ~*YandexBot             1;
    ~*DuckDuckBot           1;
    ~*Sogou\s+web\s+spider  1;
    ~*360Spider             1;
    ~*HaosouSpider          1;
    ~*Yisouspider           1;
    ~*Bytespider            1;
    ~*Applebot              1;
    ~*facebookexternalhit   1;
    ~*Twitterbot            1;
    ~*LinkedInBot           1;
    ~*WhatsApp              1;
    ~*Slackbot              1;
    ~*TelegramBot           1;
    ~*ia_archiver           1;
}

server {
    listen 80;
    server_name xuaweb3.com www.xuaweb3.com;
    client_max_body_size 20M;
    root /usr/share/nginx/html;

    # Vite 打包出的带 hash 文件名 → 一年强缓存
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # favicon 等静态文件适度缓存
    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # 老后台（黑猫）→ geoflow
    location /heicat {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Phase 1：新后台（玄猫，Filament）→ Laravel
    location /xuacat {
        proxy_pass http://laravel:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Filament 静态资源 — 仅命中 Filament 实际生成的路径
    # （vendor/、storage/ 已剔除：vendor 是 composer 私有目录不应暴露，
    #  storage 需要 storage:link 才会用到，目前没建链接）
    location ~ ^/(livewire|js/filament|css/filament|fonts/filament)/ {
        proxy_pass http://laravel:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Phase 1：导航公共 API → Laravel（前缀更长，自动盖过下面的 /api）
    # /api/v1/nav/categories | /sites | /sites/:id | /recommended
    location /api/v1/nav/ {
        proxy_pass http://laravel:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Phase 3：文章公共 API → Laravel
    # /api/v1/articles  |  /api/v1/articles/by-slug/:slug
    location /api/v1/articles {
        proxy_pass http://laravel:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Phase 5.3：鉴权管理 API → Laravel
    #   /api/v1/catalog | /api/v1/tasks/* | /api/v1/jobs/{id} | /api/v1/admin/articles/*
    location ~ ^/api/v1/(catalog|tasks|jobs|admin) {
        proxy_pass http://laravel:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 关键：透传 Authorization 头给 Laravel（默认会但显式声明保险）
        proxy_set_header Authorization $http_authorization;
    }

    # Phase 9.3：API fallback allowlist — 仅 auth/login 走老 backend
    location = /api/v1/auth/login {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # 剩余 /api/* 直接 404（非 allowlist 的一律拒绝）
    location /api {
        return 404;
    }

    # Phase 9.2：封住老 backend 内部目录；geoflow 保留，但不暴露实现文件
    # includes/ 与 bin/ 都是 PHP/内部实现文件，不应公网访问。
    location ^~ /includes/ {
        return 404;
    }

    location ^~ /bin/ {
        return 404;
    }

    # GEOFlow backend assets（仅保留非 PHP 资源给旧页面回滚使用）
    location ~ ^/(themes|lang)/ {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
    }

    # Phase 9.1：Sitemap → Laravel（老 backend sitemap.php 保留用于回滚）
    location = /sitemap.xml {
        proxy_pass http://laravel:8000/sitemap.xml;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # GEOFlow root PHP files (article.php, category.php, etc.)
    location ~ \.php$ {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Phase 8：爬虫 SSR → Laravel（替代老 render_seo.php）
    # 用户无法直接访问 /__seo_*，仅通过下面的 UA-based rewrite 抵达
    # 阻断外部直接访问 Laravel SEO 路由（只能走 nginx 内部 /__seo_* 入口）
    location ^~ /__seo/ {
        return 404;
    }

    location = /__seo_home {
        internal;
        proxy_pass http://laravel:8000/__seo/home;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location ~ ^/__seo_category/(?<seo_slug>.+)$ {
        internal;
        proxy_pass http://laravel:8000/__seo/category/$seo_slug;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location ~ ^/__seo_project/(?<seo_pid>\d+)$ {
        internal;
        proxy_pass http://laravel:8000/__seo/project/$seo_pid;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /__seo_articles {
        internal;
        proxy_pass http://laravel:8000/__seo/articles;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location ~ ^/__seo_article/(?<seo_art_slug>.+)$ {
        internal;
        proxy_pass http://laravel:8000/__seo/article/$seo_art_slug;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # SPA index.html 不缓存（保证用户拿到最新 hash 引用）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 首页：爬虫 → SSR；用户 → SPA
    location = / {
        if ($is_crawler = 1) {
            rewrite ^ /__seo_home last;
        }
        try_files $uri /index.html;
    }

    # 分类页 /c/:slug：爬虫 → SSR；用户 → SPA
    location ~ ^/c/(?<spa_cat_slug>[a-zA-Z0-9_-]+)/?$ {
        if ($is_crawler = 1) {
            rewrite ^ /__seo_category/$spa_cat_slug last;
        }
        try_files $uri $uri/ /index.html;
    }

    # 项目详情页 /project/:id：爬虫 → SSR；用户 → SPA
    location ~ ^/project/(?<spa_pid>\d+)/?$ {
        if ($is_crawler = 1) {
            rewrite ^ /__seo_project/$spa_pid last;
        }
        try_files $uri $uri/ /index.html;
    }

    # 文章列表页 /articles：爬虫 → SSR；用户 → SPA
    location = /articles {
        if ($is_crawler = 1) {
            rewrite ^ /__seo_articles last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /articles/ {
        if ($is_crawler = 1) {
            rewrite ^ /__seo_articles last;
        }
        try_files $uri $uri/ /index.html;
    }

    # 文章详情页 /articles/:slug：爬虫 → SSR；用户 → SPA
    # （/api/v1/articles 是更长前缀的 API location，先于此命中，不冲突）
    location ~ ^/articles/(?<spa_art_slug>[a-zA-Z0-9_-]+)/?$ {
        if ($is_crawler = 1) {
            rewrite ^ /__seo_article/$spa_art_slug last;
        }
        try_files $uri $uri/ /index.html;
    }

    # Vue SPA fallback - must be last
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
