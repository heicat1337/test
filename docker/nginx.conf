# Gzip 全局开启
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/rss+xml
    application/atom+xml
    application/manifest+json
    application/ld+json
    application/wasm
    image/svg+xml
    font/ttf
    font/otf;

# 爬虫 UA 识别 — Baidu / Google / Bing / 360 / Sogou / Yandex / SNS 抓取器
map $http_user_agent $is_crawler {
    default 0;
    "~*Baiduspider"           1;
    "~*Googlebot"             1;
    "~*bingbot"               1;
    "~*YandexBot"             1;
    "~*DuckDuckBot"           1;
    "~*Sogou\s+web\s+spider"  1;
    "~*360Spider"             1;
    "~*HaosouSpider"          1;
    "~*Yisouspider"           1;
    "~*Bytespider"            1;
    "~*Applebot"              1;
    "~*facebookexternalhit"   1;
    "~*Twitterbot"            1;
    "~*LinkedInBot"           1;
    "~*WhatsApp"              1;
    "~*Slackbot"              1;
    "~*TelegramBot"           1;
    "~*ia_archiver"           1;
}

server {
    listen 80;
    server_name xuaweb3.com www.xuaweb3.com;
    client_max_body_size 20M;
    root /usr/share/nginx/html;

    # Vite 打包出的带 hash 文件名 → 一年强缓存
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # favicon 等静态文件适度缓存
    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Admin panel
    location /heicat {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GEOFlow API
    location /api {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GEOFlow backend assets
    location ~ ^/(themes|lang|includes)/ {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
    }

    # Sitemap
    location = /sitemap.xml {
        proxy_pass http://geoflow:8080/sitemap.php;
        proxy_set_header Host $host;
    }

    # GEOFlow root PHP files (article.php, category.php, etc.)
    location ~ \.php$ {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 内部入口：爬虫专属 SSR 渲染（用户无法直接访问，仅通过 rewrite 抵达）
    location = /__seo_home {
        internal;
        proxy_pass http://geoflow:8080/render_seo.php?route=home;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/__seo_category/(?<seo_slug>.+)$ {
        internal;
        proxy_pass http://geoflow:8080/render_seo.php?route=category&slug=$seo_slug;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA index.html 不缓存（保证用户拿到最新 hash 引用）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 首页：爬虫 → SSR；用户 → SPA
    location = / {
        if ($is_crawler = 1) {
            rewrite ^ /__seo_home last;
        }
        try_files $uri /index.html;
    }

    # 分类页 /c/:slug：爬虫 → SSR；用户 → SPA
    location ~ ^/c/(?<spa_cat_slug>[a-zA-Z0-9_-]+)/?$ {
        if ($is_crawler = 1) {
            rewrite ^ /__seo_category/$spa_cat_slug last;
        }
        try_files $uri $uri/ /index.html;
    }

    # Vue SPA fallback - must be last
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
