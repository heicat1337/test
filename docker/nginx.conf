# Gzip 全局开启
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/rss+xml
    application/atom+xml
    application/manifest+json
    application/ld+json
    application/wasm
    image/svg+xml
    font/ttf
    font/otf;

server {
    listen 80;
    server_name xuaweb3.com www.xuaweb3.com;
    client_max_body_size 20M;
    root /usr/share/nginx/html;

    # Vite 打包出的带 hash 文件名 → 一年强缓存
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # favicon 等静态文件适度缓存
    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Admin panel
    location /heicat {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GEOFlow API
    location /api {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GEOFlow backend assets
    location ~ ^/(themes|lang|includes)/ {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
    }

    # Sitemap
    location = /sitemap.xml {
        proxy_pass http://geoflow:8080/sitemap.php;
        proxy_set_header Host $host;
    }

    # GEOFlow root PHP files (article.php, category.php, etc.)
    location ~ \.php$ {
        proxy_pass http://geoflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA index.html 不缓存（保证用户拿到最新 hash 引用）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Vue SPA fallback - must be last
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
